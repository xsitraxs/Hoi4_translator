name: CI and Windows EXE

# Pull requests are validated by the pull_request trigger only; pushing a
# feature branch does not run everything twice.
on:
  push:
    branches: ["main", "release/**"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Tests (Rust stable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        # Non-blocking on purpose: the 2.0 port was written in an environment
        # without a Rust toolchain, so `cargo fmt --all` has not been run over
        # it yet. Flip `continue-on-error` to false once it has.
        continue-on-error: true
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets

      - name: Unit and integration tests
        run: cargo test --all --verbose

      - name: Dry-run the bundled demo mod
        # Proves the parser, the CLI and the process exit codes work on a real
        # mod without touching the network.
        run: |
          cargo run --release -- --src examples/demo-mod --dst /tmp/hoi4-out --target ru --dry-run

      - name: Check that the release tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag version=$version"
          test "$tag" = "$version"

  build:
    name: Build Windows binary
    # Building on every pull request doubles the Windows minutes for little
    # value; manual dispatch covers the "will it still build?" question.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Smoke-test the binary
        shell: pwsh
        run: |
          # --help exits before any folder is touched, so a broken build fails
          # here instead of on the user's PC.
          .\target\release\hoi4-translator.exe --help
          .\target\release\hoi4-translator.exe --src examples\demo-mod --dst "$env:TEMP\hoi4-out" --target ru --dry-run

      - name: Upload binary as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hoi4-translator-windows
          path: target/release/hoi4-translator.exe

  release:
    name: Publish release assets
    # Separated from build so the write token is only present on tags.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum */hoi4-translator.exe | tee SHA256SUMS.txt
          test -s SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.3.3
        with:
          name: "Hoi4 Translator ${{ github.ref_name }}"
          files: |
            artifacts/hoi4-translator-windows/hoi4-translator.exe
            artifacts/SHA256SUMS.txt
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
