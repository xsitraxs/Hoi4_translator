name: CI and Windows EXE

# Pull requests are validated by the pull_request trigger only; pushing a
# feature branch no longer runs everything twice.
on:
  push:
    branches: ["main", "release/**"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.4.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'ruff==0.17.0' coverage

      - name: Lint
        run: python -m ruff check hoi4_translator.py hoi4translator/ tests/

      - name: Compile Python
        run: |
          python -m compileall -q hoi4translator tests hoi4_translator.py
          python -m py_compile hoi4_translator.py tests/test_translator_behaviour.py

      - name: Run unit tests with coverage
        run: |
          python -m coverage run --source=hoi4translator -m unittest discover -s tests -v
          python -m coverage report --fail-under=40

      - name: Check that the release tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import hoi4_translator; print(hoi4_translator.__version__)")
          echo "tag=$tag version=$version"
          test "$tag" = "$version"

  build:
    name: Build Windows EXE
    # Building the EXE on every pull request doubles the Windows minutes for
    # little value; manual dispatch covers the "will it still build?" question.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Java (for JPype)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.4.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Java JAR
        shell: pwsh
        run: |
          javac -d java java/com/hoi4/translator/HoI4Translator.java
          Push-Location java
          jar cf ../hoi4_translator.jar com/
          Pop-Location
          Write-Host "✅ JAR created: hoi4_translator.jar"

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --onefile `
            --noconsole `
            --name "Hoi4_Translator" `
            --collect-submodules="hoi4translator" `
            --collect-all="customtkinter" `
            --collect-all="darkdetect" `
            --collect-all="deep_translator" `
            --collect-all="deepl" `
            --collect-all="keyring" `
            --hidden-import="keyring.backends.Windows" `
            --hidden-import="aiohttp" `
            --hidden-import="aiohttp.connector" `
            --hidden-import="aiohttp.client" `
            --hidden-import="sqlite3" `
            --hidden-import="jpype" `
            --hidden-import="jpype.imports" `
            --add-data "hoi4_translator.jar;." `
            --add-data "hoi4translator/gui/amber.json;hoi4translator/gui/" `
            hoi4_translator.py

      - name: Smoke-test the EXE
        shell: pwsh
        run: |
          # --help exits before constructing a window, so a broken import or a
          # missing hidden dependency fails here instead of on the user's PC.
          ./dist/Hoi4_Translator.exe --help
        continue-on-error: false

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Hoi4_Translator
          path: dist/Hoi4_Translator.exe

      - name: Upload JavaSim JAR as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hoi4_translator_jar
          path: hoi4_translator.jar

  release:
    name: Publish release assets
    # Separated from build so the write token is only present on tags.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      # A PyInstaller build is not reproducible, so the hash has to come from
      # the very file that is published. Computing it here is the only way to
      # publish a checksum users can actually verify.
      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum */Hoi4_Translator.exe */hoi4_translator.jar | tee SHA256SUMS.txt
          test -s SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.3.3
        with:
          name: "Hoi4 Translator ${{ github.ref_name }}"
          files: |
            artifacts/Hoi4_Translator/Hoi4_Translator.exe
            artifacts/hoi4_translator_jar/hoi4_translator.jar
            artifacts/SHA256SUMS.txt
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
