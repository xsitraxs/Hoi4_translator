name: CI and Windows EXE

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and Java compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m py_compile hoi4_translator.py tests/test_translator_behaviour.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Java service
        run: |
          mkdir -p "$RUNNER_TEMP/hoi4-translator-classes"
          javac -d "$RUNNER_TEMP/hoi4-translator-classes" \
            java/com/hoi4/translator/HoI4Translator.java

  build:
    name: Build Windows EXE
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java (for JPype)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Java JAR
        shell: pwsh
        run: |
          javac -d java java/com/hoi4/translator/HoI4Translator.java
          Push-Location java
          jar cf ../hoi4_translator.jar com/
          Pop-Location
          Write-Host "✅ JAR created: hoi4_translator.jar"

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --onefile `
            --noconsole `
            --name "Hoi4_Translator" `
            --collect-all="deep_translator" `
            --collect-all="keyring" `
            --hidden-import="keyring.backends.Windows" `
            --hidden-import="aiohttp" `
            --hidden-import="aiohttp.connector" `
            --hidden-import="aiohttp.client" `
            --hidden-import="sqlite3" `
            --hidden-import="jpype" `
            --hidden-import="jpype.imports" `
            --add-data "hoi4_translator.jar;." `
            hoi4_translator.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hoi4_Translator
          path: dist/Hoi4_Translator.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Hoi4 Translator ${{ github.ref_name }}"
          files: dist/Hoi4_Translator.exe
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
